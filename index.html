<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Basic Event-Driven Webpage</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main id="pageContainer">
        <p class="student-info">
            Name: DANRIO JAY L.BAYLON | Course/Section: BSIT 31-ITE-05 | Date: August 21, 2026
        </p>

        <h1 id="mainHeading">Basic Event-Driven Webpage</h1>

        <label for="nameInput">Enter your name:</label>
        <input
            type="text"
            id="nameInput"
            placeholder="Type your name"
        >

        <div class="button-group">
            <button id="greetingButton">Display Greeting</button>
            <button id="backgroundButton">Change Background</button>
            <button id="resetButton">Reset</button>
        </div>

        <p id="messageArea">
            Enter your name and select an action.
        </p>
    </main>
</body>
</html>
